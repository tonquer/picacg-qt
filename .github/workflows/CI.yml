# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  macos:
    runs-on: macos-latest
    env:
      PACKAGENAME: bika_macos_universal2
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install sr-vulkan
        pip install sr-vulkan-model-waifu2x
        pip install sr-vulkan-model-realcugan
        pip install sr-vulkan-model-realesrgan
        cd script
        pip install delocate wheel_filename==1.4.2
        python build_universal2.py pillow
        python build_universal2.py cffi 1.17.1
        python build_universal2.py curl_cffi 0.13.0
        python build_universal2.py pyyaml 6.0.2
        pip install *.whl
        cd ..

        pip install -r src/requirements_macos.txt
        brew install create-dmg
    - name: Build
      run: |
        python script/build_qrc.py
        cd src
        cd db
        unzip -o book.zip
        rm book.zip
        cd ..
        cp ../res/icon/Icon.icns ./
        pyinstaller --target-architecture=universal2 --clean --onedir --name PicACG \
            --hidden-import sr_ncnn_vulkan --hidden-import PySide6 --hidden-import requests \
            --hidden-import urllib3 --hidden-import websocket-client --hidden-import pillow \
            --hidden-import config \
            --hidden-import component \
            --hidden-import server \
            --hidden-import task \
            --hidden-import tools \
            --hidden-import view \
            --add-data "db:db" \
            --strip --windowed -i Icon.icns \
            start.py
        xattr -cr dist/PicACG.app
        xattr -dr com.apple.quarantine dist/PicACG.app
        create-dmg --volname "PicACG" --volicon "Icon.icns" --icon "PicACG.app" 200 190 \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --hide-extension "PicACG.app" --app-drop-link 600 185 \
            ${{ env.PACKAGENAME }}.dmg dist/PicACG.app

        zip -9 bika.zip ${{ env.PACKAGENAME }}.dmg
        mv ${{ env.PACKAGENAME }}.dmg ..
        mv bika.zip ..
        cd ..
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: bika.zip
        retention-days: 7

  windows:
    runs-on: windows-latest
    env:
      PACKAGENAME: bika_py310_windows_x64
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r src\requirements.txt
        
        Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v5.0.1/upx-5.0.1-win64.zip" -OutFile "upx.zip"
        Expand-Archive -Path "upx.zip" -DestinationPath "D:\"
        Remove-Item "upx.zip"

    - name: Build
      run: |
        python script/build_qrc.py
        cd src
        cd db
        7z x book.zip
        Remove-Item "book.zip"
        cd ..

        cp ..\res\icon\icon.ico .\

        pyinstaller --hidden-import=_cffi_backend --collect-all curl_cffi -F -w -i icon.ico start.py --upx-dir "D:\upx-5.0.1-win64"
        mv dist bika
        Copy-Item -Verbose -Recurse -Path db -Destination bika/
        cp ..\LICENSE bika\
        cp ..\CHANGELOG bika\
        cd ..
        mkdir ${{ env.PACKAGENAME }}
        mv src\bika ${{ env.PACKAGENAME }}
        7z a -r "$($Env:PACKAGENAME + '.zip')" "bika"
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}
        retention-days: 7

  ubuntu-appimage:
    runs-on: ubuntu-latest
    container:
      image: tonquer/ubuntu-python:24.04
      options: --privileged
    env:
      PACKAGENAME: picacg_py310_linux_glibc2.39
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r src/requirements.txt
    - name: Build
      run: |
        python3 script/build_qrc.py
        cd src
        pyinstaller --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        cd dist
        cd db
        unzip -o book.zip
        rm book.zip
        cd ..        
        mkdir -p picacg.AppRun/usr/bin
        cp -r ../../res/appimage/* picacg.AppRun/
        cp -r ../../res/icon/logo_round.png picacg.AppRun/PicACG.png
        cp -r start/* picacg.AppRun/usr/bin/
        cp -r ../db  picacg.AppRun/

        chmod +x picacg.AppRun/AppRun
        chmod +x picacg.AppRun/usr/bin/start
        appimagetool-x86_64.AppImage picacg.AppRun
        mv PicACG-x86_64.AppImage ../../${{ env.PACKAGENAME }}.AppImage
        cd ../..
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.AppImage
        retention-days: 7
