name: release
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      build_macos:
        description: '打包 macOS 双架构'
        type: boolean
        default: false
      build_windows:
        description: '打包 Windows x64'
        type: boolean
        default: true
      build_ubuntu_glibc239:
        description: '打包 linux x64 glibc2.39+ AppImage'
        type: boolean
        default: false
      build_ubuntu_glibc228:
        description: '打包 linux x64 glibc2.28+ AppImage'
        type: boolean
        default: false
      build_uos_deb:
        description: '打包 uos V20(deepin V20) deb'
        type: boolean
        default: false
      build_ubuntu_deb:
        description: '打包 ubuntu deb'
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      PACKAGE_PREFIX: ${{ steps.get-package_prefix.outputs.PACKAGE_PREFIX }}
      TAG_NAME: ${{ steps.get-package_prefix.outputs.TAG_NAME }}
      HEAD_SHA_SHORT: ${{ steps.get-package_prefix.outputs.HEAD_SHA_SHORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: 生成构建版本
        id: get-package_prefix
        run: python3 script/release_metadata.py

  macos:
    if: github.event_name == 'push' || github.event.inputs.build_macos == 'true'
    needs: [setup]
    runs-on: macos-latest
    env:
      PACKAGENAME: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_macos_universal2
      PACKAGENAME_NOSR: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_macos_nosr_universal2
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        cd script
        pip install delocate wheel_filename==1.4.2
        python build_universal2.py pillow
        python build_universal2.py cffi 1.17.1
        python build_universal2.py curl_cffi 0.13.0
        python build_universal2.py pyyaml 6.0.2
        pip install *.whl
        cd ..
        pip install -r src/requirements_macos.txt
        brew install create-dmg
    - name: Build_nosr
      run: |
        python script/build_qrc.py
        cd src
        cd db
        unzip -o book.zip
        rm book.zip
        cd ..
        cp ../res/icon/Icon.icns ./
        pyinstaller -y --target-architecture=universal2 --clean --onedir --name PicACG \
            --hidden-import PySide6 --hidden-import requests \
            --hidden-import urllib3 --hidden-import websocket-client --hidden-import pillow \
            --hidden-import config \
            --hidden-import component \
            --hidden-import server \
            --hidden-import task \
            --hidden-import tools \
            --hidden-import view \
            --add-data "db:db" \
            --strip --windowed -i Icon.icns \
            start.py
        xattr -cr dist/PicACG.app
        xattr -dr com.apple.quarantine dist/PicACG.app
        create-dmg --volname "PicACG" --volicon "Icon.icns" --icon "PicACG.app" 200 190 \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --hide-extension "PicACG.app" --app-drop-link 600 185 \
            ${{ env.PACKAGENAME_NOSR }}.dmg dist/PicACG.app
        mv ${{ env.PACKAGENAME_NOSR }}.dmg ..
        cd ..
    - name: Build
      run: |
        pip install sr-vulkan
        pip install sr-vulkan-model-waifu2x
        pip install sr-vulkan-model-realcugan
        pip install sr-vulkan-model-realesrgan
        cd src
        cp ../res/icon/Icon.icns ./
        pyinstaller -y --target-architecture=universal2 --clean --onedir --name PicACG \
            --hidden-import PySide6 --hidden-import requests \
            --hidden-import urllib3 --hidden-import websocket-client --hidden-import pillow \
            --hidden-import config \
            --hidden-import component \
            --hidden-import server \
            --hidden-import task \
            --hidden-import tools \
            --hidden-import view \
            --add-data "db:db" \
            --strip --windowed -i Icon.icns \
            start.py
        xattr -cr dist/PicACG.app
        xattr -dr com.apple.quarantine dist/PicACG.app
        create-dmg --volname "PicACG" --volicon "Icon.icns" --icon "PicACG.app" 200 190 \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --hide-extension "PicACG.app" --app-drop-link 600 185 \
            ${{ env.PACKAGENAME }}.dmg dist/PicACG.app
        mv ${{ env.PACKAGENAME }}.dmg ..
        cd ..
    - name: upload-macos-artifact-nosr
      uses: actions/upload-artifact@v4
      with:
          name: ${{ env.PACKAGENAME_NOSR }}
          path: ${{ env.PACKAGENAME_NOSR }}.dmg
          if-no-files-found: error
    - name: upload-macos-artifact
      uses: actions/upload-artifact@v4
      with:
          name: ${{ env.PACKAGENAME }}
          path: ${{ env.PACKAGENAME }}.dmg
          if-no-files-found: error

  windows:
    if: github.event_name == 'push' || github.event.inputs.build_windows == 'true'
    needs: [setup]
    runs-on: windows-latest
    env:
      PACKAGENAME: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_windows_x64
      PACKAGENAME_NOSR: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_windows_nosr_x64
      EXE_NAME: start.exe
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip        
          pip install pyinstaller
          pip install -r src\requirements_nosr.txt
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v5.0.1/upx-5.0.1-win64.zip" -OutFile "upx.zip"
          Expand-Archive -Path "upx.zip" -DestinationPath "D:\"
          Remove-Item "upx.zip"
      - name: Build_nosr
        run: |
          python script/build_qrc.py
          cd src
          cd db
          7z x book.zip
          Remove-Item book.zip
          cd ..
          Copy-Item ..\res\icon\icon.ico .         
          pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi -F -w -i icon.ico start.py --upx-dir "D:\upx-5.0.1-win64"
          # python -m nuitka `
          #   --onefile `
          #   --onefile-no-compression `
          #   --output-dir=dist `
          #   --output-filename=PicACG `
          #   --windows-console-mode=disable `
          #   --msvc=latest `
          #   --clang `
          #   --assume-yes-for-downloads `
          #   --windows-icon-from-ico=icon.ico `
          #   --plugin-enable=pyside6,upx --upx-binary="D:\upx-5.0.1-win64" `
          #   start.py
          
          $pkg = "bika"
          Remove-Item -Recurse -Force $pkg -ErrorAction SilentlyContinue
          New-Item $pkg -ItemType Directory
          Move-Item "dist\$env:EXE_NAME" "$pkg\start.exe"
          Copy-Item -Recurse db               $pkg\
          Copy-Item ..\LICENSE                $pkg\
          Copy-Item ..\CHANGELOG              $pkg\
          7z a -t7z -mx9 "$env:PACKAGENAME_NOSR.7z" $pkg
          Move-Item "${env:PACKAGENAME_NOSR}.7z" ..\
          cd ..
      - name: Build
        run: |
          pip install -r src\requirements.txt
          cd src
          Copy-Item ..\res\icon\icon.ico .         
          pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi -F -w -i icon.ico start.py --upx-dir "D:\upx-5.0.1-win64"
          $pkg = "bika"
          Remove-Item -Recurse -Force $pkg -ErrorAction SilentlyContinue
          New-Item $pkg -ItemType Directory
          Move-Item "dist\$env:EXE_NAME" "$pkg\start.exe"
          Copy-Item -Recurse db               $pkg\
          Copy-Item ..\LICENSE                $pkg\
          Copy-Item ..\CHANGELOG              $pkg\
          7z a -t7z -mx9 "$env:PACKAGENAME.7z" $pkg
          Move-Item "${env:PACKAGENAME}.7z" ..\
          cd ..
      - name: Upload artifact nosr
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGENAME_NOSR }}
          path: ${{ env.PACKAGENAME_NOSR }}.7z
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGENAME }}
          path: ${{ env.PACKAGENAME }}.7z
          if-no-files-found: error

  ubuntu:
    if: github.event_name == 'push' || github.event.inputs.build_ubuntu_deb == 'true'
    needs: [setup, release]
    runs-on: ubuntu-latest
    container:
      image: tonquer/ubuntu-python:22.04
      options: --privileged
    env:
      PACKAGENAME: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_ubuntu_amd64
      PACKAGENAME_NOSR: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_ubuntu_nosr_amd64
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r src/requirements_nosr.txt
        python3 script/build_qrc.py
    - name: Build_nosr
      run: |
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        
        cd db
        unzip -o book.zip
        rm book.zip
        cd ..
        
        cd dist
        cp -r ../../res/ubuntu .
        find start -name "libxkbcommon*" -delete
        cp -r start/* ubuntu/opt/PicACG/
        cp -r ../db ubuntu/opt/PicACG/
        chmod -R 755 ubuntu
        dpkg-deb --root-owner-group  -b ubuntu picacg.deb
        mv picacg.deb ../../${{ env.PACKAGENAME_NOSR }}.deb
        cd ../..
    - name: Build
      run: |
        pip install -r src/requirements.txt
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        cd dist
        cp -r ../../res/ubuntu .
        find start -name "libxkbcommon*" -delete
        cp -r start/* ubuntu/opt/PicACG/
        cp -r ../db ubuntu/opt/PicACG/
        chmod -R 755 ubuntu
        dpkg-deb --root-owner-group  -b ubuntu picacg.deb
        mv picacg.deb ../../${{ env.PACKAGENAME }}.deb
        cd ../..

    - name: Upload artifact nosr
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME_NOSR }}
        path: ${{ env.PACKAGENAME_NOSR }}.deb
        if-no-files-found: error

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.deb
        if-no-files-found: error

  uos:
    if: github.event_name == 'push' || github.event.inputs.build_uos_deb == 'true'
    needs: [setup, release]
    runs-on: ubuntu-latest
    container:
      image: tonquer/deepin-python:v20
      options: --privileged
    env:
      PACKAGENAME: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_uos_amd64
      PACKAGENAME_NOSR: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_uos_nosr_amd64
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r src/requirements_nosr.txt
        python3 script/build_qrc.py
    - name: Build_nosr
      run: |
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        
        cd db
        unzip -o book.zip
        rm book.zip
        cd ..

        cd dist
        cp -r ../../res/uos .
        find start -name "libxkbcommon*" -delete
        cp -r start/* uos/opt/apps/org.tonquer.picacg/files/
        cp -r ../db uos/opt/apps/org.tonquer.picacg/files/
        chmod -R 755 uos
        dpkg-deb --root-owner-group  -b uos picacg.deb
        mv picacg.deb ../../${{ env.PACKAGENAME_NOSR }}.deb
        cd ../..
    - name: Build
      run: |
        pip install -r src/requirements.txt
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        cd dist
        cp -r ../../res/uos .
        find start -name "libxkbcommon*" -delete
        cp -r start/* uos/opt/apps/org.tonquer.picacg/files/
        cp -r ../db uos/opt/apps/org.tonquer.picacg/files/
        chmod -R 755 uos
        dpkg-deb --root-owner-group  -b uos picacg.deb
        mv picacg.deb ../../${{ env.PACKAGENAME }}.deb
        cd ../..

    - name: Upload artifact nosr
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME_NOSR }}
        path: ${{ env.PACKAGENAME_NOSR }}.deb
        if-no-files-found: error

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.deb
        if-no-files-found: error

  ubuntu-appimage228:
    if: github.event_name == 'push' || github.event.inputs.build_ubuntu_glibc228 == 'true'
    needs: [setup, release]
    runs-on: ubuntu-latest
    container:
      image: tonquer/deepin-python:v20
      options: --privileged
    env:
      PACKAGENAME: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_linux-glibc2.28
      PACKAGENAME_NOSR: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_linux_nosr-glibc2.28
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r src/requirements_nosr.txt
        python3 script/build_qrc.py
    - name: Build_nosr
      run: |
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
                
        cd db
        unzip -o book.zip
        rm book.zip
        cd ..
        
        cd dist
        mkdir -p picacg.AppRun/usr/bin
        cp -r ../db picacg.AppRun/
        cp -r ../../res/appimage/* picacg.AppRun/
        cp -r ../../res/icon/logo_round.png picacg.AppRun/PicACG.png
        find start -name "libxkbcommon*" -delete
        cp -r start/* picacg.AppRun/usr/bin/

        chmod +x picacg.AppRun/AppRun
        chmod +x picacg.AppRun/usr/bin/start
        appimagetool-x86_64.AppImage picacg.AppRun
        mv PicACG-x86_64.AppImage ../../${{ env.PACKAGENAME_NOSR }}.AppImage
        cd ../..
    - name: Build
      run: |
        pip install -r src/requirements.txt
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        cd dist
        mkdir -p picacg.AppRun/usr/bin
        cp -r ../db picacg.AppRun/
        cp -r ../../res/appimage/* picacg.AppRun/
        cp -r ../../res/icon/logo_round.png picacg.AppRun/PicACG.png
        find start -name "libxkbcommon*" -delete
        cp -r start/* picacg.AppRun/usr/bin/

        chmod +x picacg.AppRun/AppRun
        chmod +x picacg.AppRun/usr/bin/start
        appimagetool-x86_64.AppImage picacg.AppRun
        mv PicACG-x86_64.AppImage ../../${{ env.PACKAGENAME }}.AppImage
        cd ../..

    - name: Upload artifact nosr
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME_NOSR }}
        path: ${{ env.PACKAGENAME_NOSR }}.AppImage
        if-no-files-found: error

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.AppImage
        if-no-files-found: error

  ubuntu-appimage239:
    if: github.event_name == 'push' || github.event.inputs.build_ubuntu_glibc239 == 'true'
    needs: [setup, release]
    runs-on: ubuntu-latest
    container:
      image: tonquer/ubuntu-python:24.04
      options: --privileged
    env:
      PACKAGENAME: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_linux-glibc2.39.AppImage
      PACKAGENAME_NOSR: ${{ needs.setup.outputs.PACKAGE_PREFIX }}_linux_nosr-glibc2.39.AppImage
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r src/requirements_nosr.txt
        python3 script/build_qrc.py
    - name: Build_nosr
      run: |
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
                
        cd db
        unzip -o book.zip
        rm book.zip
        cd ..
        
        cd dist
        mkdir -p picacg.AppRun/usr/bin
        cp -r ../db picacg.AppRun/
        cp -r ../../res/appimage/* picacg.AppRun/
        cp -r ../../res/icon/logo_round.png picacg.AppRun/PicACG.png
        find start -name "libxkbcommon*" -delete
        cp -r start/* picacg.AppRun/usr/bin/

        chmod +x picacg.AppRun/AppRun
        chmod +x picacg.AppRun/usr/bin/start
        appimagetool-x86_64.AppImage picacg.AppRun
        mv PicACG-x86_64.AppImage ../../${{ env.PACKAGENAME_NOSR }}.AppImage
        cd ../..
    - name: Build
      run: |
        pip install -r src/requirements.txt
        cd src
        pyinstaller -y --hidden-import=_cffi_backend --collect-all curl_cffi  -w start.py
        cd dist
        mkdir -p picacg.AppRun/usr/bin
        cp -r ../db picacg.AppRun/
        cp -r ../../res/appimage/* picacg.AppRun/
        cp -r ../../res/icon/logo_round.png picacg.AppRun/PicACG.png
        find start -name "libxkbcommon*" -delete
        cp -r start/* picacg.AppRun/usr/bin/

        chmod +x picacg.AppRun/AppRun
        chmod +x picacg.AppRun/usr/bin/start
        appimagetool-x86_64.AppImage picacg.AppRun
        mv PicACG-x86_64.AppImage ../../${{ env.PACKAGENAME }}.AppImage
        cd ../..

    - name: Upload artifact nosr
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME_NOSR }}
        path: ${{ env.PACKAGENAME_NOSR }}.AppImage
        if-no-files-found: error

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.AppImage
        if-no-files-found: error

  release:
    name: 发布标签构建产物
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [setup, macos, macos-nosr, windows, windows-nosr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: 创建或更新草稿预发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.setup.outputs.TAG_NAME }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-artifacts -type f \( -name '*.dmg' -o -name '*.7z' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "没有可发布的构建产物" >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" --title "$TAG_NAME" --draft --prerelease --verify-tag
          fi
