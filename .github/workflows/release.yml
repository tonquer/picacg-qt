  release:
    name: 发布标签构建产物
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [setup, macos, macos-nosr, windows, windows-nosr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: 创建或更新草稿预发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.setup.outputs.TAG_NAME }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-artifacts -type f \( -name '*.dmg' -o -name '*.7z' \) -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "没有可发布的构建产物" >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" --title "$TAG_NAME" --draft --prerelease --verify-tag
          fi
